x-ai-stack:
  runtime:
    kind: suite
    title: FunASR Gateway
    title_zh: FunASR 语音网关
    publish_policy: all_ready
    load_policy: lazy
    card_mode: grouped
    health_path: /healthz
    primary_endpoint:
      kind: transcription
      method: POST
      path: /transcription/transcribe
    components:
      - model_id: sensevoicesmall
        role: asr
        required: true
      - model_id: speech_fsmn_vad_zh-cn-16k-common-pytorch
        role: vad
        required: true
      - model_id: speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-pytorch
        role: diarization-asr
        required: true
      - model_id: punc_ct-transformer_zh-cn-common-vocab272727-pytorch
        role: punctuation
        required: false
      - model_id: speech_campplus_sv_zh-cn_16k-common
        role: speaker-verification
        required: false
      - model_id: speech_campplus_speaker-diarization_common
        role: speaker-diarization
        required: false

services:
  funasr-gateway:
    image: ${FUNASR_GATEWAY_IMAGE:-local/ai-stack-funasr-gateway:latest}
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/custom/funasr-gateway.Dockerfile
      args:
        PYTORCH_BASE_IMAGE: ${PYTORCH_BASE_IMAGE:-nvcr.io/nvidia/pytorch:25.04-py3}
    container_name: custom_funasr_gateway_service
    gpus: all
    ipc: host
    ports:
      - "${AI_STACK_BIND_ADDR:-0.0.0.0}:${FUNASR_PUBLIC_PORT:-8011}:8011"
    restart: ${AI_STACK_RESTART_POLICY:-unless-stopped}
    volumes:
      - ../../../models:/models:ro
      - ../../../cache:/cache
    environment:
      - MODEL_PROVIDER=funasr
      - MODEL_DEVICE=${MODEL_DEVICE:-cuda}
      - MODEL_DOWNLOAD_ON_STARTUP=false
      - MODELSCOPE_CACHE=/cache/modelscope
      - ASR_MODEL_ID=${ASR_MODEL_ID:-iic/SenseVoiceSmall}
      - ASR_RUNTIME_MODEL=${ASR_RUNTIME_MODEL:-/models/sensevoicesmall}
      - ASR_VAD_MODEL_ID=${ASR_VAD_MODEL_ID:-iic/speech_fsmn_vad_zh-cn-16k-common-pytorch}
      - ASR_VAD_RUNTIME_MODEL=${ASR_VAD_RUNTIME_MODEL:-/models/speech_fsmn_vad_zh-cn-16k-common-pytorch}
      - DIARIZATION_ASR_MODEL_ID=${DIARIZATION_ASR_MODEL_ID:-iic/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-pytorch}
      - DIARIZATION_ASR_RUNTIME_MODEL=${DIARIZATION_ASR_RUNTIME_MODEL:-/models/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-pytorch}
      - DIARIZATION_PUNC_MODEL_ID=${DIARIZATION_PUNC_MODEL_ID:-iic/punc_ct-transformer_zh-cn-common-vocab272727-pytorch}
      - DIARIZATION_PUNC_RUNTIME_MODEL=${DIARIZATION_PUNC_RUNTIME_MODEL:-/models/punc_ct-transformer_zh-cn-common-vocab272727-pytorch}
      - DIARIZATION_MODEL_ID=${DIARIZATION_MODEL_ID:-iic/speech_campplus_sv_zh-cn_16k-common}
      - DIARIZATION_RUNTIME_MODEL=${DIARIZATION_RUNTIME_MODEL:-/models/speech_campplus_sv_zh-cn_16k-common}
      - FULL_DIARIZATION_MODEL_ID=${FULL_DIARIZATION_MODEL_ID:-iic/speech_campplus_speaker-diarization_common}
      - FULL_DIARIZATION_RUNTIME_MODEL=${FULL_DIARIZATION_RUNTIME_MODEL:-/models/speech_campplus_speaker-diarization_common}
      - ASR_BATCH_SIZE_SECONDS=${ASR_BATCH_SIZE_SECONDS:-300}
