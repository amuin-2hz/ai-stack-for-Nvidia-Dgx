#
# Custom Unlimited-OCR profile.
# Built locally from PyTorch + HuggingFace Transformers so target machines do
# not need a preloaded local/ai-stack-unlimited-ocr image.
#
services:
  unlimited-ocr-service:
    image: ${UNLIMITED_OCR_IMAGE:-local/ai-stack-unlimited-ocr:latest}
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/custom/ocr-unlimited.Dockerfile
      args:
        PYTORCH_BASE_IMAGE: ${PYTORCH_BASE_IMAGE:-nvcr.io/nvidia/pytorch:25.04-py3}
    container_name: custom_unlimited_ocr_service
    gpus: all
    ipc: host
    ports:
      - "${AI_STACK_BIND_ADDR:-0.0.0.0}:${UNLIMITED_OCR_PUBLIC_PORT:-33030}:8000"
    restart: ${AI_STACK_RESTART_POLICY:-no}
    volumes:
      - ${MODELS_ROOT:-../../../models}/${MODEL_ALIAS:-unlimited-ocr}:/models/${MODEL_ALIAS:-unlimited-ocr}:ro
      - ../../../cache/hf:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_VISIBLE_DEVICES:-all}
      - HF_TOKEN=${HF_TOKEN:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-unlimited-ocr}
    command:
      - python
      - -m
      - ai_stack_ocr_server
      - --model
      - /models/${MODEL_ALIAS:-unlimited-ocr}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
