# AI Stack-managed Qwen3-TTS family runtime (internal orchestration).
# MODEL_ALIAS selects the model eagerly loaded at startup; the other completed
# family checkpoints remain addressable and are loaded on demand.
services:
  qwen3-tts-service:
    image: ${QWEN3_TTS_IMAGE:-local/ai-stack-qwen3-tts:0.1.1}
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/custom/qwen3-tts.Dockerfile
      args:
        PYTORCH_BASE_IMAGE: ${PYTORCH_BASE_IMAGE:-nvcr.io/nvidia/pytorch:25.04-py3}
    container_name: custom_qwen3_tts_service
    labels:
      - amuin.role=model-runtime
      - amuin.runtime=qwen3-tts
      - amuin.model=${MODEL_ALIAS:-qwen3-tts-12hz-1.7b-customvoice}
      - amuin.profile=qwen3-tts
    gpus: all
    ipc: host
    init: true
    ports:
      - "${AI_STACK_BIND_ADDR:-0.0.0.0}:${QWEN3_TTS_PUBLIC_PORT:-18020}:8000"
    restart: ${AI_STACK_RESTART_POLICY:-unless-stopped}
    volumes:
      - ${MODELS_ROOT:-../../../models}/qwen3-tts-12hz-1.7b-customvoice:/models/qwen3-tts-12hz-1.7b-customvoice:ro
      - ${MODELS_ROOT:-../../../models}/qwen3-tts-12hz-1.7b-voicedesign:/models/qwen3-tts-12hz-1.7b-voicedesign:ro
      - ${MODELS_ROOT:-../../../models}/qwen3-tts-12hz-1.7b-base:/models/qwen3-tts-12hz-1.7b-base:ro
      - ../../../cache:/cache
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_VISIBLE_DEVICES:-all}
      - OPENAI_MODEL=${OPENAI_MODEL:-qwen3-tts-12hz-1.7b-customvoice}
      - QWEN3_TTS_PRIMARY_MODEL=${MODEL_ALIAS:-qwen3-tts-12hz-1.7b-customvoice}
      - QWEN3_TTS_DEVICE=${QWEN3_TTS_DEVICE:-cuda:0}
      - QWEN3_TTS_DTYPE=${QWEN3_TTS_DTYPE:-bfloat16}
      - QWEN3_TTS_ATTN_IMPLEMENTATION=${QWEN3_TTS_ATTN_IMPLEMENTATION:-auto}
      - QWEN3_TTS_MODEL_CACHE_SIZE=${QWEN3_TTS_MODEL_CACHE_SIZE:-1}
      - QWEN3_TTS_MAX_CONCURRENCY=${QWEN3_TTS_MAX_CONCURRENCY:-1}
      - QWEN3_TTS_EAGER_LOAD=${QWEN3_TTS_EAGER_LOAD:-true}
      - QWEN3_TTS_REQUIRE_COMPLETE_MARKER=${QWEN3_TTS_REQUIRE_COMPLETE_MARKER:-true}
      - QWEN3_TTS_MAX_INPUT_CHARS=${QWEN3_TTS_MAX_INPUT_CHARS:-4000}
      - QWEN3_TTS_MAX_REFERENCE_AUDIO_BYTES=${QWEN3_TTS_MAX_REFERENCE_AUDIO_BYTES:-15728640}
      - HF_HOME=/cache/huggingface
      - MODELSCOPE_CACHE=/cache/modelscope
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 3
