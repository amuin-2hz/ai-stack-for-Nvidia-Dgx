services:
  vibevoice-hf:
    image: ${VIBEVOICE_HF_IMAGE:-local/ai-stack-vibevoice-hf:latest}
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/custom/vibevoice-hf.Dockerfile
      args:
        PYTORCH_BASE_IMAGE: ${PYTORCH_BASE_IMAGE:-nvcr.io/nvidia/pytorch:25.04-py3}
    container_name: custom_vibevoice_hf_service
    gpus: all
    ipc: host
    ports:
      - "${AI_STACK_BIND_ADDR:-0.0.0.0}:${VIBEVOICE_PUBLIC_PORT:-18000}:8000"
    restart: ${AI_STACK_RESTART_POLICY:-unless-stopped}
    volumes:
      - ../../../models:/models:ro
      - ../../../cache:/cache
    environment:
      - VIBEVOICE_RUNTIME_MODEL=${VIBEVOICE_RUNTIME_MODEL:-/models/vibevoice-asr-hf}
      - VIBEVOICE_MODEL=${VIBEVOICE_MODEL:-vibevoice}
      - VIBEVOICE_DEVICE=${VIBEVOICE_DEVICE:-cuda}
      - VIBEVOICE_DTYPE=${VIBEVOICE_DTYPE:-bfloat16}
      - HF_HOME=/cache/huggingface
