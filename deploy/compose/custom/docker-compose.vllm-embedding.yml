#
# Custom vLLM embedding profile.
# Use for qwen3-embedding-8b with the complete local model checkout.
#
services:
  vllm-embedding-service:
    image: ${VLLM_EMBEDDING_IMAGE:-local/ai-stack-vllm-embedding:latest}
    build:
      context: ../../..
      dockerfile: deploy/dockerfiles/custom/vllm-embedding.Dockerfile
      args:
        VLLM_BASE_IMAGE: ${VLLM_BASE_IMAGE:-vllm/vllm-openai:latest}
    container_name: custom_vllm_embedding_service
    labels:
      - amuin.role=model-runtime
      - amuin.runtime=vllm
      - amuin.model=${MODEL_ALIAS:-qwen3-embedding-8b}
      - amuin.profile=vllm-embedding
    gpus: all
    ipc: host
    ports:
      - "${AI_STACK_BIND_ADDR:-127.0.0.1}:${VLLM_EMBEDDING_PUBLIC_PORT:-33010}:8000"
    restart: ${AI_STACK_RESTART_POLICY:-no}
    volumes:
      - ${MODELS_ROOT:-../../../models}/${MODEL_ALIAS:-qwen3-embedding-8b}:/models/${MODEL_ALIAS:-qwen3-embedding-8b}:ro
      - ../../../cache/hf:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_VISIBLE_DEVICES:-all}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    command:
      - --model
      - /models/${MODEL_ALIAS:-qwen3-embedding-8b}
      - --served-model-name
      - ${OPENAI_MODEL:-qwen3-embedding-8b}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --trust-remote-code
      - --runner
      - pooling
      - --convert
      - embed
      - --tensor-parallel-size
      - ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-4096}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.2}
