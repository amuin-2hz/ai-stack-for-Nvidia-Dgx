x-build-base: &build-base
  build:
    context: ../..
    dockerfile: deploy/dockerfiles/Dockerfile.llamacpp
  image: local/llama.cpp:server-cuda

services:
  qwen3-vl:
    <<: *build-base
    container_name: qwen3-vl
    volumes:
      - ../../models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "-m"
      - "/models/Qwen3-VL-8B-Instruct-Q4_K_M.gguf"
      - "--mmproj"
      - "/models/Qwen3-VL-8B-Instruct-mmproj-Q8_0.gguf"
      - "--port"
      - "8000"
      - "--host"
      - "0.0.0.0"
      - "-n"
      - "1024"
      - "--n-gpu-layers"
      - "999"
      - "--jinja"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      
  qwen3-embedding:
    <<: *build-base
    container_name: qwen3-embedding
    volumes:
      - ../../models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: 
      - "-m"
      - "/models/Qwen3-Embedding-4B-Q4_K_M.gguf"
      - "--port"
      - "8000"
      - "--host"
      - "0.0.0.0"
      - "--jinja"
      - "--embeddings"

  qwen3-8b:
    <<: *build-base
    container_name: qwen3-8b
    volumes:
      - ../../models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: 
      - "-m"
      - "/models/Qwen3-8B-Q4_K_M.gguf"
      - "--port"
      - "8000"
      - "--host"
      - "0.0.0.0"
      - "-n"
      - "4096"
      - "--n-gpu-layers"
      - "999"
      - "--jinja"

  qwen25-coder:
    <<: *build-base
    container_name: qwen25-coder
    volumes:
      - ../../models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: 
      - "-m"
      - "/models/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf"
      - "--port"
      - "8000"
      - "--host"
      - "0.0.0.0"
      - "-n"
      - "2048"
      - "--n-gpu-layers"
      - "999"
      - "--jinja"

volumes:
  ollama-data:
  
networks:
  default:
    name: chatbot-net
    external: true
