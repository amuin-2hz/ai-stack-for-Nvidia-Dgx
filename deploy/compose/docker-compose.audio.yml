services:
  api:
    container_name: api
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    ports:
      - "${AI_STACK_BIND_ADDR:-0.0.0.0}:8000:8000"
    volumes:
      - ../../models:/models
      - ../../state:/state
      - ../../configs:/configs
      - ../../logs:/logs
    depends_on:
      - postgres
      - etcd
      - minio
      - milvus
      - audio-service
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=chatbot
      - POSTGRES_USER=chatbot_user
      - POSTGRES_PASSWORD=chatbot_password
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MILVUS_ADDRESS=milvus:19530
      - MODELS=qwen3-8b
      - AUDIO_SERVICE_URL=http://audio-service:9000
      - AUDIO_SERVICE_WS_URL=ws://audio-service:9000/ws/realtime
      - MODELS_ROOT=/models
      - STATE_ROOT=/state
      - VLLM_PUBLIC_PORT=30000
      - TRTLLM_PUBLIC_PORT=31000
      - AUDIO_PUBLIC_PORT=32000

  audio-service:
    container_name: audio-service
    build:
      context: ../../services/audio
      dockerfile: Dockerfile
    ports:
      - "${AI_STACK_BIND_ADDR:-0.0.0.0}:32000:9000"
    volumes:
      - ../../services/audio:/app
      - ../../models:/models
      - ../../cache/modelscope:/root/.cache/modelscope
      - ../../cache/whisper:/root/.cache/whisper
    environment:
      - MODELS_ROOT=/models
      - FUNASR_MODEL=FunAudioLLM/Fun-ASR-MLT-Nano-2512
      - FUNASR_VAD_MODEL=fsmn-vad
      - FUNASR_PUNC_MODEL=ct-punc
      - COSYVOICE_MODEL=iic/CosyVoice-300M-SFT
      - AUDIO_ENABLE_MOCK_FALLBACK=0
    restart: unless-stopped
    gpus: all

  postgres:
    container_name: postgres
    image: postgres:15-alpine
    ports:
      - "${AI_STACK_BIND_ADDR:-0.0.0.0}:5432:5432"
    environment:
      - POSTGRES_DB=chatbot
      - POSTGRES_USER=chatbot_user
      - POSTGRES_PASSWORD=chatbot_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-../..}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-../..}/volumes/minio:/minio_data
    command: minio server /minio_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.15-20250718-3a3b374f-gpu-arm64
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-../..}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${AI_STACK_BIND_ADDR:-0.0.0.0}:19530:19530"
      - "${AI_STACK_BIND_ADDR:-0.0.0.0}:9091:9091"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: chatbot-net
    external: true
